[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexova-api"
version = "0.1.0"
description = "Nexova central API service"
requires-python = ">=3.11"
dependencies = [
    "celery>=5.6.3",
    "email-validator>=2.0",
    "fastapi>=0.111,<0.155",
    "flower>=2.2.0",
    "libpass[bcrypt]>=1.9.3",
    "pandas>=2.2",
    "prefect>=3",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.9",
    "redis>=8.1.0",
    "resend>=2.0.0",
    "sqlalchemy>=2.0,<2.1",
    "sqlmodel>=0.0.42",
    "tinydb>=4.8",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
seed = "seed:main"
seed-inventory = "seed_inventory:main"

[tool.setuptools]
py-modules = ["seed", "seed_inventory", "models", "schemas", "database", "email_service", "password_resets", "telemetry_store"]
packages = ["telemetry", "reporting", "tasks"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
