[project]
name = "nexova-tools"
version = "0.1.0"
description = "MCP Server de Nexova: tickets del Incidents Manager e inventario (solo lectura), protegido con OAuth vía MCP Auth."
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.2.0",
    "httpx>=0.28.1",
    # 0.2.0b1: primera versión con modo resource server (Protected Resource Metadata).
    "mcpauth==0.2.0b1",
    "pydantic>=2.14.3",
    "pyjwt[crypto]>=2.15",
    "uvicorn>=0.54.0",
]

[project.scripts]
nexova-tools = "nexova_mcp.server:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "nexova_mcp"
module-root = ""

[dependency-groups]
dev = [
    "anyio>=4.16.0",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
